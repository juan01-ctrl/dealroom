name: Verify sandbox
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prior_sha:
        description: Full commit SHA of the previous approved backend release
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://sandbox:sandbox@localhost:5432/negotiation
      MODEL_MODE: scripted
      TEST_DATABASE_URL: postgresql://sandbox:sandbox@localhost:5432/negotiation
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox
          POSTGRES_DB: negotiation
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sandbox -d negotiation" --health-interval 3s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --python 3.12
        working-directory: backend
      - run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
        working-directory: backend
      - run: uv run --locked pytest -q
        working-directory: backend
      - name: Run the scripted negotiation release gate
        id: scripted-gate
        run: |
          uv run --locked python -m app.migrate
          uv run --locked python -m app.evaluations --output "$RUNNER_TEMP/scripted-evaluations.json"
          python -c 'import json, sys; assert json.load(sys.stdin)["release_gate"]["passed"] is True' \
            < "$RUNNER_TEMP/scripted-evaluations.json"
        working-directory: backend
      - name: Publish the scripted result for this SHA
        if: ${{ !cancelled() && steps.scripted-gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scripted-evaluations-${{ github.sha }}
          path: ${{ runner.temp }}/scripted-evaluations.json
          if-no-files-found: error
      - run: |
          uv run --locked python -m app.migrate
          nohup uv run --locked uvicorn app.api:app --port 8000 > /tmp/sandbox-api.log 2>&1 &
          for lane in negotiation evaluation; do
            nohup uv run --locked python -m app.worker --lane "$lane" > "/tmp/sandbox-$lane.log" 2>&1 &
          done
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8000/ready
        working-directory: backend
      - run: |
          npm ci
          npm run build
          npm exec -- tsc --noEmit
          npx playwright install --with-deps chromium
          nohup npm run start > /tmp/sandbox-ui.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://localhost:3000/ > /dev/null
          npm test
        working-directory: frontend
      - name: Print service logs
        if: failure()
        run: |
          for log in /tmp/sandbox-*.log; do
            if [ -f "$log" ]; then tail -n 80 "$log"; fi
          done

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Audit locked Python runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/dealroom-requirements.txt" > /dev/null
          uv tool run --python 3.12 --from pip-audit==2.10.0 pip-audit \
            --requirement "$RUNNER_TEMP/dealroom-requirements.txt" --strict --disable-pip --require-hashes
        working-directory: backend
      - name: Audit locked npm dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
        if: ${{ !cancelled() }}

  container-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise container startup, schema upgrade, worker recovery and restore
        run: bash scripts/release-smoke.sh

  qualify-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIOR_SHA: ${{ inputs.prior_sha }}
      RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the prior backend from its recorded revision
        run: |
          [[ "$PRIOR_SHA" =~ ^[0-9a-f]{40}$ && "$PRIOR_SHA" != "$GITHUB_SHA" ]]
          git cat-file -e "$PRIOR_SHA^{commit}"
          mkdir -p "$RELEASE_EVIDENCE_DIR" "$RUNNER_TEMP/prior-source"
          git archive "$PRIOR_SHA" backend frontend/package-lock.json | tar -x -C "$RUNNER_TEMP/prior-source"
          git show "$PRIOR_SHA:docs/evaluation-results.json" > "$RELEASE_EVIDENCE_DIR/prior-reference-report.json"
          printf '%s\n' "$PRIOR_SHA" > "$RELEASE_EVIDENCE_DIR/prior-sha.txt"
          (cd "$RUNNER_TEMP/prior-source" && shasum -a 256 backend/uv.lock frontend/package-lock.json \
            backend/evals/fixtures/*.json backend/migrations/*.sql) > "$RELEASE_EVIDENCE_DIR/prior-input-sha256.txt"
          docker build --tag "dealroom-prior:$PRIOR_SHA" "$RUNNER_TEMP/prior-source/backend"
      - name: Qualify the candidate with mixed workers, recovery and database workload
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          BASELINE_IMAGE="dealroom-prior:$PRIOR_SHA" bash scripts/release-smoke.sh \
            2>&1 | tee "$RELEASE_EVIDENCE_DIR/release-smoke.log"
        shell: bash
      - name: Publish candidate evidence for this SHA
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
