[project]
name = "negotiation-sandbox"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langchain-openai>=1,<2",
  "langchain-anthropic>=1,<2",
  "langsmith>=0.4,<1",
  "langfuse>=5,<6",
  "opentelemetry-sdk>=1.40,<2",
  "psycopg-pool>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
