services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox-local
      POSTGRES_DB: negotiation
    ports:
      - "127.0.0.1:${DEALROOM_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d negotiation"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - negotiation-data:/var/lib/postgresql/data
volumes:
  negotiation-data:
